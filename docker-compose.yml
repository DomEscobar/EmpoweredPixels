services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ep_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      EP_HTTP_ADDRESS: ${EP_HTTP_ADDRESS}
      EP_DATABASE_URL: ${EP_DATABASE_URL}
      EP_JWT_SECRET: ${EP_JWT_SECRET}
      EP_ENGINE_URL: ${EP_ENGINE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "49101:54321"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "49100:80"

volumes:
  ep_postgres_data:
